[package]
name = "qp_vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Solana vault whose funds only move with an on-chain-verified hash-based signature"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-account-info = "3"
solana-cpi = "3"
solana-instruction = "3"
solana-program-entrypoint = "3"
solana-program-error = "3"
solana-pubkey = "4"
solana-rent = { version = "4", features = ["sysvar"] }
solana-sha256-hasher = "3"

# Off-chain builds (unit tests, tooling) need software SHA-256 and curve
# arithmetic; on-chain these are runtime syscalls.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-sha256-hasher = { version = "3", features = ["sha2"] }
solana-pubkey = { version = "4", features = ["curve25519"] }

[features]
no-entrypoint = []

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
